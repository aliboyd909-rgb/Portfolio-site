<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Portfolio</title>
  <meta name="description" content="Photography, production and creative portfolio." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..600;1,9..144,300..600&family=Inter:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="is-loading">
  <!-- Intro loader -->
  <div class="loader" aria-hidden="true">
    <div class="loader__name"></div>
    <div class="loader__count">0</div>
  </div>

  <!-- Page-transition curtain -->
  <div class="curtain" aria-hidden="true"><span class="curtain__label"></span></div>

  <!-- Custom cursor (desktop only) -->
  <div class="cursor" aria-hidden="true"><span class="cursor__label"></span></div>

  <header class="nav">
    <a href="#/" class="nav__logo" data-cursor="Home"></a>
    <button class="nav__toggle" aria-label="Menu" aria-expanded="false"><span></span><span></span></button>
    <nav class="nav__links">
      <a href="#/work" data-cursor="">Work</a>
      <a href="#/about" data-cursor="">About</a>
      <a href="#/contact" data-cursor="">Contact</a>
    </nav>
  </header>

  <main id="app" tabindex="-1"></main>

  <!-- Lightbox -->
  <div class="lightbox" role="dialog" aria-modal="true" aria-label="Image viewer" hidden>
    <div class="lightbox__backdrop"></div>
    <div class="lightbox__stage"></div>
    <button class="lightbox__btn lightbox__close" aria-label="Close" data-cursor="Close">✕</button>
    <button class="lightbox__btn lightbox__prev" aria-label="Previous" data-cursor="Prev">←</button>
    <button class="lightbox__btn lightbox__next" aria-label="Next" data-cursor="Next">→</button>
    <div class="lightbox__count"></div>
  </div>

  <script src="js/app.js" type="module"></script>
</body>
</html>
